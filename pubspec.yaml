name: fluxer_dart_gateway
description: >-
  WebSocket gateway client for Fluxer: an explicit connection state
  machine, heartbeat management, typed dispatch events, and multi-shard
  support with reconnect/resume handling.
version: 0.1.0
homepage: https://github.com/oppahansi/fluxer_dart_gateway
repository: https://github.com/oppahansi/fluxer_dart_gateway
# Uses path deps on sibling packages during local development — remove this
# line once those are published/hosted and this is ready for a real release.
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  fluxer_dart_core:
    path: ../fluxer_dart_core
  fluxer_dart_utils:
    path: ../fluxer_dart_utils
  web_socket_channel: ^3.0.3

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: ^1.31.2
